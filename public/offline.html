<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline &middot; Consumer Tissue Data System</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/pwa/favicon-32.png" />
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: #f1f5f9; color: #1f2937; padding: 24px;
        }
        @media (prefers-color-scheme: dark) { body { background: #0b1120; color: #e2e8f0; } .card { background: #111a2e !important; border-color: #1e293b !important; } }
        .card {
            max-width: 420px; width: 100%; text-align: center;
            background: #fff; border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 40px 32px; box-shadow: 0 10px 30px rgba(0,0,0,.06);
        }
        img { height: 44px; margin-bottom: 20px; opacity: .9; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #64748b; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
        button {
            border: 0; background: #2a78d6; color: #fff; font-weight: 600; font-size: 14px;
            padding: 10px 22px; border-radius: 10px; cursor: pointer;
        }
        button:hover { background: #256abf; }
        .hint { margin-top: 18px; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/gds-logo.svg" alt="GDS" />
        <h1>You're offline</h1>
        <p>The Data System couldn't reach the server. This app needs a live connection to load and save data.</p>
        <button onclick="location.reload()">Try again</button>
        <div class="hint">Your last-loaded screens and settings are kept — reconnect to continue.</div>
    </div>
    <script>
        // Auto-retry the moment the browser regains connectivity.
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
